name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build + Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Claude.Core.Tests/Claude.Core.Tests.csproj
          dotnet restore MegaSchoen.Avalonia.Tests/MegaSchoen.Avalonia.Tests.csproj
      # Coverage is measured on the Windows TFM (this runner) so Windows-only code
      # counts toward the denominator; coverlet.msbuild instruments at build time, so
      # this step builds (no --no-build). Exclusions (generated + live-OS Win32 glue)
      # live in the test .csproj. The scope/baseline is documented in TEST-REPORT.md.
      - name: Test + coverage (Windows TFM)
        shell: pwsh
        run: >
          dotnet test Claude.Core.Tests/Claude.Core.Tests.csproj
          -f net10.0-windows10.0.26100.0 -c Release -v normal
          /p:CollectCoverage=true /p:CoverletOutput=coverage.cobertura.xml
      # The net10.0 TFM carries the Linux-only tests (ProcFileSystem, the Linux
      # process locator) that the Windows TFM #if-excludes; run it for correctness.
      - name: Test (Linux TFM)
        shell: pwsh
        run: dotnet test Claude.Core.Tests/Claude.Core.Tests.csproj -f net10.0 -c Release -v normal
      - name: Test Avalonia lifecycle
        shell: pwsh
        run: >
          dotnet test MegaSchoen.Avalonia.Tests/MegaSchoen.Avalonia.Tests.csproj
          -c Release --no-restore -v normal
          /p:CollectCoverage=true /p:CoverletOutput=coverage.cobertura.avalonia.xml
      # Parse Cobertura natively in PowerShell (the Windows runner has no python) and
      # POST the pr-crew/coverage commit status the gate reads. Merges line hits across
      # any matched reports (covered if any report hits the line). state=error (still
      # exit 0 under if:always) when no report is found, so the gate sees "unreadable".
      - name: Post coverage status
        if: always()
        shell: pwsh
        run: |
          $state = "error"; $desc = "coverage measurement failed"
          try {
            $files = Get-ChildItem -Path . -Recurse -Filter coverage.cobertura*.xml |
              Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' }
            if (-not $files) { throw "no Cobertura XML matched" }
            $lines = @{}
            foreach ($file in $files) {
              [xml]$report = Get-Content -LiteralPath $file.FullName
              foreach ($class in $report.SelectNodes('//class')) {
                $filename = $class.filename
                foreach ($line in $class.SelectNodes('.//line')) {
                  $key = "${filename}:$($line.number)"
                  $hit = ([int]$line.hits) -gt 0
                  if ($lines.ContainsKey($key)) { $lines[$key] = $lines[$key] -or $hit }
                  else { $lines[$key] = $hit }
                }
              }
            }
            $total = $lines.Count
            if ($total -eq 0) { throw "no source lines in Cobertura XML" }
            $covered = ($lines.Values | Where-Object { $_ }).Count
            $invariant = [System.Globalization.CultureInfo]::InvariantCulture
            $pct = ([math]::Round(100.0 * $covered / $total, 2)).ToString($invariant)
            $state = "success"; $desc = "$pct% line coverage"
          } catch {
            Write-Host "coverage parse failed: $_"
          }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ context = "pr-crew/coverage"; state = $state; description = $desc; target_url = $runUrl } | ConvertTo-Json -Compress
          Write-Host "posting status: $body"
          curl.exe -sk -X POST `
            -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Content-Type: application/json" `
            -d $body `
            "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  package-windows:
    name: Avalonia Release package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Release solution with VS 2026 MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "64-bit MSBuild.exe not found via vswhere." }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild MegaSchoen.sln -p:Configuration=Release -restore -nologo -v:minimal -m
          if ($LASTEXITCODE -ne 0) { throw "Release solution build failed ($LASTEXITCODE)" }
      - name: Verify Avalonia x64 output and native P/Invoke
        shell: pwsh
        run: |
          $expectedSuffix = [IO.Path]::Combine("x64", "Release", "net10.0", "win-x64", "MegaSchoen.Avalonia.exe")
          $executable = Get-ChildItem MegaSchoen.Avalonia\bin -Recurse -Filter MegaSchoen.Avalonia.exe |
            Where-Object { $_.FullName.EndsWith($expectedSuffix, [StringComparison]::OrdinalIgnoreCase) } |
            Select-Object -First 1
          if (-not $executable) { throw "Expected Windows x64 Avalonia executable ending in '$expectedSuffix' was not produced." }
          $nativeDll = Join-Path $executable.DirectoryName "DisplayManagerNative.dll"
          if (-not (Test-Path -LiteralPath $nativeDll -PathType Leaf)) {
            throw "DisplayManagerNative.dll was not copied beside $($executable.FullName)."
          }
          $process = Start-Process -FilePath $executable.FullName -ArgumentList "--verify-native" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Avalonia native P/Invoke verification failed ($($process.ExitCode))." }
          Write-Host "Verified x64 Release executable and DisplayManagerNative P/Invoke: $($executable.FullName)"
      - name: Test display manager core and CLI cooldown
        shell: pwsh
        run: dotnet test DisplayManager.Core.Tests/DisplayManager.Core.Tests.csproj -c Release --no-build -v normal

  lint:
    name: Lint C# (format + analyzers)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        shell: pwsh
        run: dotnet restore MegaSchoen.sln
      # Formatting gate: whitespace / end-of-line per .editorconfig, across all .cs in
      # the solution. (Style/analyzer categories are NOT run here: dotnet format's
      # workspace mis-reports CA1416 platform-compat on the Windows-only MAUI code,
      # which the authoritative MSBuild build does not — see the analyzer gate below.)
      - name: Format check (whitespace)
        shell: pwsh
        run: dotnet format whitespace MegaSchoen.sln --verify-no-changes --no-restore
      # Analyzer gate: zero warnings (Roslyn + Roslynator) as errors. Covers the managed
      # projects that build under the dotnet CLI. DisplayManager.Core, DisplayManagerCLI
      # and MegaSchoen reference the native DisplayManagerNative.vcxproj (and MegaSchoen is
      # MAUI), so they require MSBuild + the C++/MAUI toolchain and are gated locally via
      # `MSBuild MegaSchoen.sln -warnaserror` (see CLAUDE.md), not on this dotnet-only runner.
      - name: Analyzer gate (warnings as errors)
        shell: pwsh
        run: |
          dotnet build Claude.Core.Tests/Claude.Core.Tests.csproj -c Release --no-restore -warnaserror
          dotnet build AgentSessionsCLI/AgentSessionsCLI.csproj -c Release --no-restore -warnaserror
          dotnet build ClaudeHookBridge/ClaudeHookBridge.csproj -c Release --no-restore -warnaserror

  lint-cpp:
    name: Lint C++ (cppcheck)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Runner-image contract: the host-mode Windows image is provisioned outside
      # this repository and must expose this validated version on PATH. Bump only
      # after re-validating the finding set against DisplayManagerNative.
      CPPCHECK_VERSION: "2.19.0"
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner-provisioned cppcheck
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cppcheck = Get-Command cppcheck -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $cppcheck) {
            throw "cppcheck $env:CPPCHECK_VERSION must be pre-installed on the Windows runner and available on PATH. Update the runner image before rerunning CI."
          }

          $versionOutput = (& $cppcheck.Source --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Runner-provided cppcheck failed its version check with exit code $LASTEXITCODE."
          }

          $expectedVersionOutput = "Cppcheck $env:CPPCHECK_VERSION"
          if ($versionOutput -ne $expectedVersionOutput) {
            throw "Expected runner-provided $expectedVersionOutput, but found '$versionOutput' at '$($cppcheck.Source)'. Update the runner image or deliberately bump CPPCHECK_VERSION after re-validating the finding set."
          }

          Write-Host "Using $versionOutput from $($cppcheck.Source)"
      # The vendored single-header json.hpp (nlohmann/json) is excluded from analysis.
      # The three suppressed info-level IDs are meta-diagnostics, not code findings:
      # --enable=all turns on `information` reporting and --error-exitcode trips on it.
      #   unmatchedSuppression       - json.hpp's own inline // cppcheck-suppress comments
      #                                don't match under our config (the file is excluded)
      #   toomanyconfigs             - the header's #ifdef matrix exceeds cppcheck's cap
      #   normalCheckLevelMaxBranches - cppcheck self-limits branch analysis depth
      # All real checks (error/warning/style/performance/portability) stay active.
      - name: cppcheck
        shell: pwsh
        run: >
          cppcheck --enable=all --inline-suppr
          --suppress=missingIncludeSystem --suppress=*:*json.hpp
          --suppress=unmatchedSuppression --suppress=toomanyconfigs
          --suppress=normalCheckLevelMaxBranches
          --error-exitcode=1
          DisplayManagerNative/DisplayManagerNative.cpp

  # ── AI-slop gate (aislop) ────────────────────────────────────────────────────
  # aislop's C#/C++ engines ship in the mtschoen/aislop fork (upstream npm has
  # neither). The gate tracks the fork's schoen/main branch: clone + npm install
  # (prepare runs the tsdown build) + run the built CLI, mirroring git-wizard's
  # aislop.yml. The Gitea-registry @schoen/aislop tarball route is RETIRED
  # (owner decision 2026-07-11, see agent-memory aislop-publish-route-retired),
  # and tracking the branch instead of a pinned commit is a deliberate owner
  # call (2026-07-13): fork engine work lands here without a per-repo bump, at
  # the cost that new rules can redden CI without a repo change - when this job
  # fails on an untouched tree, diff the fork, not this repo. The old
  # POSIX-only-build-script objection to git installs is obsolete (fixed in the
  # fork; runner-side install proven green on git-wizard PR #74, 2026-07-11).
  # aislop's C# LINT engine shells out to BOTH roslynator AND jb (ReSharper
  # CLT) - installing only roslynator made the lint pass run roslynator-only
  # and never surface the jb/* findings, a FALSE GREEN. Both are installed
  # below. Threshold + excludes + jbProjects scope live in .aislop/config.yml.
  aislop:
    name: Lint AI-slop (aislop)
    runs-on: windows-latest
    timeout-minutes: 45     # full-solution build (native C++ + MAUI) + jb inspectcode is slow
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-node here: this is a host-mode Windows runner with
      # Node LTS pre-installed (v24, the same node actions/checkout uses). On
      # host mode setup-node@v4 tries to download a node .7z and extract it with
      # act's bundled 7zr.exe, which fails with exit code 2 and breaks the job.
      # The host node (>= aislop's node>=20 floor) serves npx directly.
      - name: Install C# lint engines (roslynator + jb / ReSharper CLT)
        shell: pwsh
        run: |
          dotnet tool update -g roslynator.dotnet.cli --version 0.12.0 --allow-downgrade
          dotnet tool update -g JetBrains.ReSharper.GlobalTools --version 2026.2.0 --allow-downgrade
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".dotnet\tools")
      # jb inspectcode loads + builds the whole solution graph (native C++ + MAUI), so it
      # needs the VS 2026 (v18) toolchain, not the dotnet CLI: the C++ "VCTools" workload
      # supplies the v145 platform toolset that DisplayManagerNative.vcxproj pins, and the
      # "NetCoreBuildTools" workload supplies the .NET SDK resolver so MSBuild.exe can build
      # the managed + MAUI projects against the standalone .NET 10 SDK (without it the build
      # fails MSB4236 "SDK Microsoft.NET.Sdk could not be found"). The runner has VS 2026
      # Build Tools at C:\BuildTools2026; vswhere -latest -products * ranks it (18.x) above
      # the also-present 2022 Build Tools (17.x) by real product version, and jb autodetects
      # the highest toolset and reuses this build.
      #
      # Use the 64-bit MSBuild (Bin\amd64\MSBuild.exe), NOT the default 32-bit Bin\MSBuild.exe.
      # The act runner service runs as LocalSystem, so the checkout lands under
      # C:\Windows\System32\config\systemprofile\.cache\act\...\hostexecutor. A 32-bit MSBuild
      # hits WOW64 file-system redirection (System32 -> SysWOW64) and cannot see the checkout,
      # failing MSB1009 "project file does not exist" even though the .sln is right there (64-bit
      # tools like dotnet + pwsh are not redirected, which is why the other jobs pass).
      # .aislop/config.yml's jbProjects scope limits ANALYSIS to managed projects;
      # DisplayManagerNative stays on cppcheck.
      - name: Build full solution (VS 2026 MSBuild)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "64-bit MSBuild.exe not found via vswhere." }
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild MegaSchoen.sln -p:Configuration=Debug -restore -nologo -v:minimal -m
          if ($LASTEXITCODE -ne 0) { throw "Solution build failed ($LASTEXITCODE)" }
      - name: Build C#/C++-capable aislop (fork schoen/main)
        shell: pwsh
        # Cloned outside the workspace so aislop does not scan the fork's own source.
        run: |
          git clone --depth 1 --branch schoen/main https://github.com/mtschoen/aislop.git "$env:RUNNER_TEMP\aislop"
          if ($LASTEXITCODE -ne 0) { throw "aislop fork clone failed ($LASTEXITCODE)" }
          git -C "$env:RUNNER_TEMP\aislop" log -1 --format="aislop fork @ %h %s"
          Push-Location "$env:RUNNER_TEMP\aislop"
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "aislop fork install/build failed ($LASTEXITCODE)" }
          Pop-Location
      - name: aislop CI gate (whole-repo score >= failBelow)
        shell: pwsh
        # Sanity-fail if the C# engine did not actually analyze the tree (avoid a silent
        # roslynator-only / Python-only pass): require a healthy supported-file count
        # alongside the score gate. Mirrors git-wizard's aislop.yml guard.
        run: |
          node "$env:RUNNER_TEMP\aislop\dist\cli.js" ci . --json > "$env:RUNNER_TEMP\aislop.json"
          $gate = $LASTEXITCODE
          $report = Get-Content "$env:RUNNER_TEMP\aislop.json" -Raw | ConvertFrom-Json
          $files = $report.summary.files
          Write-Host "aislop score $($report.score) over $files files"
          if ($files -lt 50) { Write-Host "::error::aislop scanned only $files files - the C# engine did not run"; exit 1 }
          if ($gate -ne 0) { Write-Host "::error::aislop score $($report.score) below failBelow"; exit 1 }
          "GATE_STATE=success" | Add-Content $env:GITHUB_ENV
      # Surfaces the score in the PR's checks list (context aislop/score, e.g.
      # "score 100/100 over 124 files"), the way pr-crew/coverage shows its
      # percentage - the schoen-lab standard (ci/post-aislop-status.py there)
      # ported to pwsh + curl.exe because the Windows runner has no python.
      # GATE_STATE is unset when the gate step died before the score check ran
      # (build failure, file-count sanity exit) - default to failure so the
      # status can never show green without a gate run; an unreadable report
      # posts state=error rather than silently missing.
      - name: Post aislop score status
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $state = if ($env:GATE_STATE) { $env:GATE_STATE } else { "failure" }
          $desc = "aislop report unreadable"
          try {
            $report = Get-Content "$env:RUNNER_TEMP\aislop.json" -Raw | ConvertFrom-Json
            $desc = "score $($report.score)/100 over $($report.summary.files) files"
          } catch { $state = "error" }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{ context = "aislop/score"; state = $state; description = $desc; target_url = $runUrl } | ConvertTo-Json -Compress
          Write-Host "posting status: $body"
          curl.exe -sk -X POST `
            -H "Authorization: token $env:GITHUB_TOKEN" `
            -H "Content-Type: application/json" `
            -d $body `
            "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA"
