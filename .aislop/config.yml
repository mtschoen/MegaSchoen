# aislop — AI-slop quality gate (https://github.com/scanaislop/aislop)
#
# STATUS: ENABLED (2026-06-01). aislop's C# engine ships in the mtschoen/aislop fork
# and this repo scans clean at 100/100, so the CI gate (the `aislop` job in
# .gitea/workflows/ci.yml) is now live. It complements - does not replace - the Roslyn
# + Roslynator + `dotnet format` gate (see Directory.Build.props / .editorconfig). aislop
# covers the C# only; the C++ in DisplayManagerNative/ stays on clang-tidy/cppcheck.
#
# How CI runs it: `npx --yes "@schoen/aislop@<version>" ci .` (see .gitea/workflows/ci.yml,
# currently 0.12.3) - the C#-capable fork build published as @schoen/aislop to the
# self-hosted Gitea npm registry (prebuilt tarball; .npmrc maps the @schoen scope). Pin a
# VERSION, never @latest; bump it deliberately + re-validate, since a newer ruleset can
# surface new findings. NOTE: public-npm `aislop` (any version, including 0.12.0) has NO C#
# engine and would false-green - the @schoen scope is what gets C#.
#
# NOT enabled: the on-save hook (`aislop hook install --claude --project`). It would pin the
# hook to a public-npm version (no C# = useless here), so run `aislop scan .` manually
# (the globally-installed fork build has the C# rules) and rely on the CI gate.

ci:
  failBelow: 100         # 0-findings bar (matches git-wizard); a single new finding red-lights the gate

# The C# lint engine shells out to `jb inspectcode` / `roslynator`. jb inspects whole
# PROJECTS, so the top-level `exclude:` globs below (which filter aislop's own globbed
# .cs file set) cannot suppress jb's C++ output: .cpp files are never in that set, so the
# native ReSharper C++ findings (jb/Cpp*) bypass the path filter entirely. The correct
# lever is jb's own `--project=` inclusion filter, exposed here as lint.csharp.jbProjects.
# This wildcard set names every MANAGED project and omits DisplayManagerNative, so jb
# never analyzes the C++ (cppcheck owns it, see .gitea/workflows/ci.yml lint-cpp job).
lint:
  csharp:
    jbProjects: "Claude*;DisplayManager.Core*;DisplayManagerCLI;MegaSchoen*"
    # jb (ReSharper) cannot follow .NET MAUI's RelativeSource / BindableLayout XAML
    # bindings, nor members that are only ever touched by XAML binding or
    # System.Text.Json (de)serialization - it reports them as unresolved bindings or
    # unused PUBLIC members, which are false positives in an MVVM + serialization app.
    # These inspection IDs are excluded repo-wide. NOTE the deliberate scope: only the
    # binding inspection and the *.Global* (non-private) unused-member family are
    # dropped - the private-scope *.Local* variants stay ACTIVE, because private members
    # are fully analyzable by jb and a .Local hit is a real dead-code signal. The
    # serialization DTOs (SnapshotDto, DisplayMode, ScenarioStep, ...) are covered by the
    # .Global excludes; the one private DTO setter (FakeProcSpec.Count) keeps a per-case
    # suppression in source. InconsistentNaming is aislop's default (naming is owned by
    # .editorconfig + MegaSchoen.sln.DotSettings) and is preserved here.
    jbExcludeTypes:
      - InconsistentNaming
      - Xaml.BindingWithContextNotResolved
      - UnusedAutoPropertyAccessor.Global
      - NotAccessedPositionalProperty.Global
      - CollectionNeverQueried.Global

exclude:
  - "**/obj/**"
  - "**/bin/**"
  - "**/*.g.cs"          # generated (XAML, source generators)
  - "**/*.Designer.cs"   # generated designer code
  - "DisplayManagerNative/**"   # C++ — aislop does not support C++ (json.hpp is vendored)
